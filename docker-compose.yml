x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://taskflow:taskflow@postgres:5432/taskflow
    REDIS_URL: redis://redis:6379/0
    OVERDUE_CHECK_SECONDS: ${OVERDUE_CHECK_SECONDS:-60}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow@postgres:5432/taskflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]

  beat:
    <<: *app
    command:
      - celery
      - -A
      - app.worker.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
